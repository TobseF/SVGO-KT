name: Publish to Maven Central

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publishing_type:
        description: 'Publishing Type (USER_MANAGED to review before release, or AUTOMATIC)'
        required: true
        default: 'USER_MANAGED'
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC

jobs:
  build-and-stage:
    name: Build & Stage (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            tasks: >-
              publishJvmPublicationToStagingRepository
              publishJsPublicationToStagingRepository
              publishLinuxX64PublicationToStagingRepository
              publishKotlinMultiplatformPublicationToStagingRepository
          - os: macos-latest
            target: macos
            tasks: >-
              publishMacosX64PublicationToStagingRepository
              publishMacosArm64PublicationToStagingRepository
              publishIosArm64PublicationToStagingRepository
              publishIosSimulatorArm64PublicationToStagingRepository
          - os: windows-latest
            target: windows
            tasks: >-
              publishMingwX64PublicationToStagingRepository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and stage publications
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew ${{ matrix.tasks }} -PhostTargetsOnly=false --no-daemon

      - name: Upload staging repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.target }}
          path: build/staging-repo
          if-no-files-found: error

  publish-to-central:
    name: Aggregate & Upload to Central Portal
    needs: build-and-stage
    runs-on: ubuntu-latest

    steps:
      - name: Download all staged publications
        uses: actions/download-artifact@v4
        with:
          pattern: staging-*
          path: merged-staging
          merge-multiple: true

      - name: Create ZIP bundle
        run: |
          cd merged-staging
          zip -r ../bundle.zip .
          cd ..
          ls -lh bundle.zip

      - name: Upload bundle to Sonatype Central Portal
        env:
          SONATYPE_TOKEN_USER: ${{ secrets.SONATYPE_TOKEN_USER }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          INPUT_PUBLISHING_TYPE: ${{ github.event.inputs.publishing_type }}
        run: |
          # Default to AUTOMATIC for tagged releases unless overridden in workflow_dispatch
          PUBLISH_TYPE="${INPUT_PUBLISHING_TYPE:-AUTOMATIC}"
          
          # Deployment name shown in the Central Portal dashboard
          DEPLOYMENT_NAME="svgo-kt-${GITHUB_REF_NAME:-manual-run}"

          echo "Uploading $DEPLOYMENT_NAME to Central Portal with publishingType=$PUBLISH_TYPE..."

          AUTH_TOKEN=$(printf "%s:%s" "$SONATYPE_TOKEN_USER" "$SONATYPE_TOKEN_PASSWORD" | base64 -w 0)

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${DEPLOYMENT_NAME}&publishingType=${PUBLISH_TYPE}" \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -F "bundle=@bundle.zip;type=application/octet-stream")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d: -f2)

          echo "HTTP Response Body: $HTTP_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Sonatype upload failed with HTTP status $HTTP_STATUS: $HTTP_BODY"
            exit 1
          fi

          echo "Successfully uploaded deployment $DEPLOYMENT_NAME!"
          echo "Track validation and release at: https://central.sonatype.com/publishing/deployments"
