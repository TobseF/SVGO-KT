name: Attach Binaries to Release

# Builds the standalone `svgo` CLI executables (and the runnable JVM jar) and attaches
# them to a GitHub Release. Runs automatically when a release is published, and can be
# triggered manually against an existing release tag via the "Run workflow" button.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. 4.1.0)'
        required: true
        type: string

# Required so `gh release upload` can write assets to the release.
permissions:
  contents: write

jobs:
  attach-binaries:
    name: Build & Attach (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            tasks: linkSvgoReleaseExecutableLinuxX64 jvmCliJar
            # Format per line: <source-glob>=<asset-name>. Empty asset-name keeps the original filename.
            assets: |
              build/bin/linuxX64/svgoReleaseExecutable/svgo.kexe=svgo-linux-x64
              build/libs/svgo-kt-cli-*.jar=
          - os: macos-latest
            name: macos
            tasks: linkSvgoReleaseExecutableMacosX64 linkSvgoReleaseExecutableMacosArm64
            assets: |
              build/bin/macosX64/svgoReleaseExecutable/svgo.kexe=svgo-macos-x64
              build/bin/macosArm64/svgoReleaseExecutable/svgo.kexe=svgo-macos-arm64
          - os: windows-latest
            name: windows
            tasks: linkSvgoReleaseExecutableMingwX64
            assets: |
              build/bin/mingwX64/svgoReleaseExecutable/svgo.exe=svgo-windows-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.tasks }} --no-daemon

      - name: Stage and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          while IFS='=' read -r src dest; do
            src="$(echo "$src" | xargs)"   # trim whitespace
            dest="$(echo "$dest" | xargs)"
            [ -z "$src" ] && continue
            for f in $src; do
              if [ ! -f "$f" ]; then
                echo "::error::Expected artifact not found: $f"
                exit 1
              fi
              if [ -n "$dest" ]; then
                cp "$f" "dist/$dest"
              else
                cp "$f" "dist/$(basename "$f")"
              fi
            done
          done <<< "${{ matrix.assets }}"

          echo "Uploading to release $TAG:"
          ls -lh dist
          gh release upload "$TAG" dist/* --clobber
